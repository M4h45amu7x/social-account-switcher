<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Account Switcher - popup mockup</title>
<script>
/* Boot (runs before first paint): apply the saved theme so the popup never flashes the wrong colours.
   "System" = no data-theme attribute, the CSS media query decides. The real extension does the same
   from src/popup/theme.ts using chrome.storage.local; this mockup uses localStorage. */
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* storage blocked: fall back to System */ }
})();
</script>
<!--
  Popup mockup (card t-513, v2). One file. Open it in a browser.
  Fake data only. No extension APIs, no network, no browser dialogs.
  The "Mockup controls" panel on the side only jumps between states. It is not part of the extension.
  Sections: tokens -> layout -> components -> motion (View Transitions) -> script (i18n, theme, motion, state, render).
-->
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-th: "IBM Plex Sans Thai", "Noto Sans Thai", "Sukhumvit Set", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --text-idle: #5b6170; --thumb: #ffffff; --thumb-line: #dcdfe5;
  --text: #16181d;
  --text-2: #5b6170;
  --line: #e3e5ea;
  --focus: #1a56d6;
  --ok: #12805c;
  --ok-bg: #e7f6ef;
  --err: #b42a18;
  --err-bg: #fdecea;
  --warn-bg: #fff6e0;
  --warn: #8a5a00;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.10);
  --fb: #145fcc; --fb-soft: #e7f0fe;
  --ig: #be1660; --ig-soft: #fce8f1;
  --yt: #c8190f; --yt-soft: #fde9e8;
  color-scheme: light;
  /* text and icons drawn on a filled accent / error / focus / ok background (WCAG AA, checked by tests/e2e/contrast.spec.ts) */
  --field-line: #838a99; --on-accent: #ffffff; --on-err: #ffffff; --on-focus: #ffffff; --on-ok: #ffffff;

  /* Motion tokens. Every animation below reads these, nothing hard-codes a duration. */
  --motion-scale: 1;                                   /* the GIF recorder raises this to slow things down */
  --dur-fast: calc(120ms * var(--motion-scale));
  --dur-base: calc(240ms * var(--motion-scale));
  --dur-slow: calc(420ms * var(--motion-scale));
  --dur-reveal: calc(560ms * var(--motion-scale));     /* Circle Reveal */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --surface: #171a1f; --surface-2: #1f232a; --text: #eceef2; --text-2: #9aa1ae;
    --line: #2b3039; --text-idle: #a9b0bd; --thumb: #333a46; --thumb-line: #465062; --focus: #6d97ff; --ok: #4cc391; --ok-bg: #12301f; --err: #ff7a66; --err-bg: #3a1714;
    --warn-bg: #352a10; --warn: #f2c35b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
    --fb: #4b95ff; --fb-soft: #16253d; --ig: #ff5ea0; --ig-soft: #3a1a2a; --yt: #ff5a4f; --yt-soft: #3a1918;
    color-scheme: dark;
    --field-line: #727a8c; --on-accent: #0b0d10; --on-err: #14080a; --on-focus: #0b0d10; --on-ok: #0b0d10;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #1f232a; --text: #eceef2; --text-2: #9aa1ae;
  --line: #2b3039; --text-idle: #a9b0bd; --thumb: #333a46; --thumb-line: #465062; --focus: #6d97ff; --ok: #4cc391; --ok-bg: #12301f; --err: #ff7a66; --err-bg: #3a1714;
  --warn-bg: #352a10; --warn: #f2c35b; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  --fb: #4b95ff; --fb-soft: #16253d; --ig: #ff5ea0; --ig-soft: #3a1a2a; --yt: #ff5a4f; --yt-soft: #3a1918;
  color-scheme: dark;
    --field-line: #727a8c; --on-accent: #0b0d10; --on-err: #14080a; --on-focus: #0b0d10; --on-ok: #0b0d10;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 14px/1.45 var(--font);
  min-height: 100vh; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; align-items: flex-start;
  padding: 24px 16px;
}
:lang(th) { font-family: var(--font-th); line-height: 1.55; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- popup (this becomes the real extension UI) ---------- */
.popup {
  --accent: var(--fb); --accent-soft: var(--fb-soft);
  width: 360px; min-height: 520px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; position: relative; flex: none;
}
.popup[data-platform="instagram"] { --accent: var(--ig); --accent-soft: var(--ig-soft); }
.popup[data-platform="youtube"] { --accent: var(--yt); --accent-soft: var(--yt-soft); }

.head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--fb), var(--ig) 55%, var(--yt)); color: #fff; flex: none; }
.head h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; min-width: 0; }
.icon-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; display: grid;
  place-items: center; cursor: pointer; color: var(--text-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { color: var(--err); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }

.tabs { margin: 0 12px; border-radius: 10px; }
/* one slide indicator for the tab bar and the segmented controls: the thumb sits behind the buttons */
.slide { --slide-pad: 4px; --slide-gap: 4px; position: relative; display: grid; grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr); gap: var(--slide-gap); padding: var(--slide-pad); background: var(--surface-2); }
.slide > .thumb { position: absolute; z-index: 0; top: var(--slide-pad); bottom: var(--slide-pad); left: var(--slide-pad);
  width: calc((100% - 2 * var(--slide-pad) - (var(--n) - 1) * var(--slide-gap)) / var(--n));
  transform: translateX(calc(var(--i) * (100% + var(--slide-gap)))); border-radius: 7px; background: var(--thumb);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 0 0 1px var(--thumb-line); pointer-events: none; }
.slide > :not(.thumb) { position: relative; z-index: 1; }
.tab { border: 0; background: transparent; border-radius: 7px; padding: 7px 1px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 12px; color: var(--text-idle); min-width: 0; }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; }
.tab .mark { width: 16px; height: 16px; flex: none; }
.tab .label { display: none; }
.tab[aria-selected="true"] .label { display: block; flex: none; white-space: nowrap; }
.tabs .tab { gap: 4px; padding: 7px 3px; }
.tab .count { flex: none; font-size: 10.5px; min-width: 16px; padding: 0 4px; border-radius: 9px; background: var(--line);
  color: var(--text-2); font-weight: 600; line-height: 16px; text-align: center; }

.body { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 8px; }
.section-label { font-size: 12px; color: var(--text-2); margin: 4px 4px 0; display: flex; justify-content: space-between; gap: 8px; }
.section-label span { overflow-wrap: anywhere; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 58px; }
.row.active { border-color: var(--accent); background: var(--accent-soft); }
.row .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none;
  padding: 0; text-align: left; cursor: pointer; }
.row .main:disabled { cursor: default; }
.row:not(.active):not(.editing):not(.confirm):hover { border-color: var(--text-2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-weight: 700; font-size: 13px; color: var(--on-accent); background: var(--accent); position: relative; }
.avatar .pf { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); display: grid; place-items: center; }
.avatar .pf img { width: 12px; height: 12px; }
.who { min-width: 0; flex: 1; }
.who .name { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.who .name .nm { unicode-bidi: isolate; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.who .name .chip { flex: none; }
.who .sub { font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.chip { font-size: 10.5px; font-weight: 600; padding: 0 7px; line-height: 17px; border-radius: 10px; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--on-accent); }
.chip.bad { background: var(--err-bg); color: var(--err); }

/* right-hand slot of a row: actions -> spinner -> result badge (the "status button" morph) */
.slot { display: flex; align-items: center; justify-content: flex-end; flex: none; min-height: 32px; }
.actions { display: flex; gap: 0; }
.flash { width: 24px; height: 24px; margin: 0 6px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.flash.ok { background: var(--ok); color: var(--on-ok); }
.flash.bad { background: var(--err); color: var(--on-err); }

.row.busy { border-color: var(--accent); }
.row.busy .who .sub { color: var(--accent); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent-soft);
  border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; margin: 0 7px; }
@keyframes spin { to { transform: rotate(360deg); } }
.steps { display: flex; gap: 4px; margin-top: 4px; }
.steps i { height: 3px; flex: 1; border-radius: 2px; background: var(--line); transition: background-color var(--dur-base) var(--ease-out); }
.steps i.done { background: var(--accent); }
.list.dim .row:not(.busy) { opacity: .5; }

.row.editing { border-color: var(--focus); }
.edit { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.edit input { width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--field-line);
  border-radius: 8px; padding: 6px 8px; }
.edit .hint { font-size: 11px; color: var(--text-2); overflow-wrap: anywhere; }
.edit .hint.bad { color: var(--err); }
.btns { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer;
  font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { background: var(--err); border-color: var(--err); color: var(--on-err); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.outline-danger { border-color: var(--err); color: var(--err); background: transparent; }

.row.confirm { border-color: var(--err); background: var(--err-bg); flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
.row.confirm p { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
.row.confirm p small { display: block; color: var(--text-2); font-size: 12px; }

.add { margin-top: 2px; border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 10px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--accent); font-weight: 600; text-align: center; }
.add:hover { background: var(--accent-soft); border-color: var(--accent); }
.add:disabled { opacity: .4; cursor: default; background: transparent; }

.panel { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.panel.add-form { border-color: var(--accent); }
.panel .ttl { font-weight: 600; font-size: 13px; }
.panel .meta { font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.note { border-radius: 10px; padding: 10px; font-size: 13px; display: flex; gap: 8px; overflow-wrap: anywhere; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.err { background: var(--err-bg); color: var(--err); flex-direction: column; }
.note.err .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.note.err .d { color: var(--text); font-size: 12px; }
.note.info { background: var(--surface-2); color: var(--text-2); font-size: 12px; }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 12px 6px; gap: 10px; }
.empty .big { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); display: grid; place-items: center; }
.empty .big img { width: 28px; height: 28px; }
.with-mark { display: inline-flex; align-items: center; gap: 6px; }
.with-mark .mark, .btn .mark { width: 14px; height: 14px; flex: none; }
.btn .mark { display: inline-block; vertical-align: -2px; margin-inline-end: 6px; }
.empty h2 { font-size: 15px; margin: 0; }
.empty ol { text-align: left; margin: 0; padding-left: 20px; color: var(--text-2); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.empty .row-btns { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }

.foot { padding: 8px 16px 12px; font-size: 11px; color: var(--text-2); display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.foot svg { flex: none; }

.toast { margin: 0 12px 8px; background: var(--text); color: var(--surface);
  border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-size: 13px;
  box-shadow: var(--shadow); }
.toast .ok { width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: var(--on-ok); display: grid; place-items: center; flex: none; }
.toast b { font-weight: 600; }
.toast .tx { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.toast .tx small { font-size: 11.5px; opacity: .8; }

.lock { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
.lock .big { width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.pw { display: flex; align-items: center; width: 100%; max-width: 280px; border: 1px solid var(--field-line); border-radius: 10px;
  background: var(--surface-2); padding: 0 4px 0 12px; }
.pw:focus-within { border-color: var(--focus); }
.pw.bad { border-color: var(--err); }
.pw input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: 15px var(--font); padding: 11px 0; outline: none; }
.pw .icon-btn { flex: none; }
.lock .wipe { width: 100%; max-width: 300px; text-align: left; }
.lock .wipe .btn { min-width: 0; padding: 5px 12px; }
.lock .hint { font-size: 12px; color: var(--text-2); min-height: 18px; overflow-wrap: anywhere; }
.lock .hint.bad { color: var(--err); }
.lock .btn { min-width: 160px; padding: 8px 12px; }
.lock .btn.primary { background: var(--focus); color: var(--on-focus); border-color: var(--focus); }

/* status button: idle -> loading -> success / error */
.sbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.sbtn .spinner { width: 14px; height: 14px; margin: 0; border-color: color-mix(in srgb, currentColor 35%, transparent); border-top-color: currentColor; }
.lock .btn.primary.is-ok { background: var(--ok); color: var(--on-ok); border-color: var(--ok); }
.lock .btn.primary.is-err { background: var(--err); color: var(--on-err); border-color: var(--err); }

/* settings page */
.settings { gap: 10px; }
.set-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.set-card h2 { font-size: 13px; margin: 0; }
.set-card p { margin: 0; font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.seg { --slide-pad: 3px; border-radius: 9px; }
.seg button { min-width: 0; border: 0; background: transparent; border-radius: 7px; padding: 6px 4px; cursor: pointer; font-size: 12.5px; color: var(--text-idle); }
.seg button[aria-pressed="true"] { color: var(--text); font-weight: 600; }
.set-card.danger { border-color: var(--err); }
.set-card.confirm { background: var(--err-bg); }
.set-card .btn { align-self: flex-start; }

.edit input::placeholder, .pw input::placeholder { color: var(--text-2); opacity: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- mockup controls (not part of the extension) ---------- */
.demo { width: 260px; max-width: 100%; background: var(--surface); border-radius: 12px; padding: 14px; box-shadow: var(--shadow);
  font-size: 13px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font); }
.demo h2 { font-size: 12px; margin: 0; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.demo .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.demo .grid button, .demo .seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px; cursor: pointer; font-size: 12px; }
.demo .grid button:hover, .demo .seg button:hover { border-color: var(--text-2); }
.demo .seg { display: flex; gap: 6px; padding: 0; background: none; }
.demo .seg button { flex: 1; }
.demo .seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
.demo label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.demo p { margin: 0; color: var(--text-2); font-size: 12px; }

/* =====================================================================
   MOTION (View Transitions API). Six transitions, one set of tokens.
   JS (motion section) sets <html data-vt="..."> for the length of a transition and names the elements.
   1 theme  - Circle Reveal: the new theme grows from the click point (the clip-path is animated in JS)
   2 tab    - the pill glides to the chosen tab, the panel slides sideways
   3 list   - add = pop in, remove = fade out, the others glide into place (also covers re-ordering)
   4 status - slot/button morph: idle -> loading -> success or error
   5 expand - rename editor, delete confirm and the wipe confirm open and close in place; settings page slides
   6 toast  - slides up on arrival, slides down on exit
   No support or prefers-reduced-motion: reduce -> JS skips the transition and the DOM just changes.
   ===================================================================== */
:root::view-transition { pointer-events: none; }
::view-transition-group(*) { animation-duration: var(--dur-base); animation-timing-function: var(--ease-out); }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
:root[data-vt="lang"]::view-transition-new(root) { animation: vt-fade-in var(--dur-base) var(--ease-out) both; }

/* 2 tab + page: the panel slides, direction comes from --vt-dir (1 = forward, -1 = back) */
:root[data-vt="tab"]::view-transition-old(panel), :root[data-vt="page"]::view-transition-old(panel) {
  animation: vt-slide-out var(--dur-base) var(--ease-in-out) both; }
:root[data-vt="tab"]::view-transition-new(panel), :root[data-vt="page"]::view-transition-new(panel) {
  animation: vt-slide-in var(--dur-slow) var(--ease-out) both; }

/* 3 list: rows with only a "new" side pop in, rows with only an "old" side fade out */
:root[data-vt="list"]::view-transition-new(.row):only-child { animation: vt-pop-in var(--dur-slow) var(--ease-out) both; }
:root[data-vt="list"]::view-transition-old(.row):only-child { animation: vt-fade-out var(--dur-base) var(--ease-in-out) both; }
::view-transition-old(.row):not(:only-child), ::view-transition-new(.row):not(:only-child) { height: 100%; }

/* 5 expand: the group resizes; old and new bodies cross-fade quickly */
:root[data-vt="expand"]::view-transition-group(.row) { animation-duration: var(--dur-slow); }
:root[data-vt="expand"]::view-transition-old(.row) { animation: vt-fade-out var(--dur-fast) linear both; }
:root[data-vt="expand"]::view-transition-new(.row) { animation: vt-fade-in var(--dur-base) var(--ease-out) both; }
:root[data-vt="expand"]::view-transition-group(card) { animation-duration: var(--dur-slow); }

/* 4 status: the slot / button box resizes while the old and new faces cross-fade */
:root[data-vt="status"]::view-transition-group(.slot), :root[data-vt="status"]::view-transition-group(sbtn) {
  animation-duration: var(--dur-slow); animation-timing-function: var(--ease-in-out); }
:root[data-vt="status"]::view-transition-old(.slot), :root[data-vt="status"]::view-transition-old(sbtn) { animation: vt-fade-out var(--dur-base) linear both; }
:root[data-vt="status"]::view-transition-new(.slot), :root[data-vt="status"]::view-transition-new(sbtn) { animation: vt-fade-in var(--dur-base) linear both; }

/* 6 toast */
::view-transition-new(toast):only-child { animation: vt-toast-in var(--dur-slow) var(--ease-out) both; }
::view-transition-old(toast):only-child { animation: vt-toast-out var(--dur-base) var(--ease-in-out) both; }

@keyframes vt-fade-in { from { opacity: 0; } }
@keyframes vt-fade-out { to { opacity: 0; } }
@keyframes vt-pop-in { from { opacity: 0; transform: scale(.92); } }
@keyframes vt-slide-out { to { opacity: 0; transform: translateX(calc(var(--vt-dir, 1) * -28px)); } }
@keyframes vt-slide-in { from { opacity: 0; transform: translateX(calc(var(--vt-dir, 1) * 28px)); } }
@keyframes vt-toast-in { from { opacity: 0; transform: translateY(16px); } }
@keyframes vt-toast-out { to { opacity: 0; transform: translateY(16px); } }

@media (prefers-reduced-motion: reduce) {
  /* No movement at all. Spinner becomes a still ring, the label still says "Switching...". */
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  .spinner { animation: none; border-top-color: var(--accent); border-right-color: var(--accent); }
  .sbtn .spinner { border-top-color: currentColor; border-right-color: currentColor; }
  .steps i { transition: none; }
}

const PREFS = { theme: "system", lang: "auto" };      // saved in localStorage here, in the extension's local storage area there
try {
  const th = localStorage.getItem("theme"), lg = localStorage.getItem("language");
  if (th === "light" || th === "dark") PREFS.theme = th;
  if (lg === "en" || lg === "th") PREFS.lang = lg;
} catch { /* ignore */ }
const savePref = (k, v) => { try { localStorage.setItem(k === "lang" ? "language" : k, v); } catch { /* ignore */ } };

// the extension asks the browser's i18n API for its UI language; navigator.language stands in for it here
const uiLang = () => ((navigator.language || "en").toLowerCase().startsWith("th") ? "th" : "en");
let LANG = PREFS.lang === "auto" ? uiLang() : PREFS.lang;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const B0 = "\u0001", B1 = "\u0002";
function lookup(key, p = {}) {
  let s = I18N[LANG][key] ?? I18N.en[key] ?? key;
  if (Array.isArray(s)) s = p.n === 1 ? s[0] : s[1];
  return s.replace(/\[\[(.+?)\]\]/g, B0 + "$1" + B1);
}
const fill = (s, p, fn) => s.replace(/\{(\w+)\}/g, (_, k) => (k in p ? fn(String(p[k]).replace(/[\u0001\u0002]/g, "")) : `{${k}}`));
/* t(): safe HTML (params escaped, [[x]] -> <b>x</b>).  ta(): plain text for attributes (escaped, no bold). */
const t = (key, p = {}) => esc(fill(lookup(key, p), p, (v) => esc(v))).replaceAll(B0, "<b>").replaceAll(B1, "</b>");
const ta = (key, p = {}) => esc(fill(lookup(key, p), p, (v) => v)).replaceAll(B0, "").replaceAll(B1, "");
const tabsText = (n) => ta("n.tabs", { n });

/* =====================================================================
   Motion helper (motion.ts in the extension). transition(mode, update) wraps a DOM update in a view transition.
   ===================================================================== */
const root = document.documentElement;
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const NAMES = [
  // [selector, name(el), class, modes it applies to]
  [".row[data-id]", (el) => "row-" + el.dataset.id, "row", ["list", "status", "expand"]],
  [".slot[data-id]", (el) => "slot-" + el.dataset.id, "slot", ["list", "status", "expand"]],
  ["[data-panel]", () => "panel", "panel", ["tab", "page"]],
  ["[data-card]", (el) => "card-" + el.dataset.card, "card", ["expand"]],
  ["[data-sbtn]", () => "sbtn", "sbtn", ["status"]],
  [".toast", () => "toast", "toast", ["*"]],
];
function applyNames(mode) {
  for (const [sel, name, cls, modes] of NAMES) {
    const on = modes.includes("*") || modes.includes(mode);
    document.querySelectorAll(sel).forEach((el) => {
      el.style.viewTransitionName = on ? name(el) : "";
      el.style.viewTransitionClass = on ? cls : "";
    });
  }
}
let vtSeq = 0;
function transition(mode, update, opts = {}) {
  if (mode === "none" || !document.startViewTransition || reducedMotion()) { update(); return null; }
  const id = ++vtSeq;
  root.dataset.vt = mode;
  root.dataset.vtBusy = "1";
  root.style.setProperty("--vt-dir", String(opts.dir ?? 1));
  applyNames(mode);
  const tr = document.startViewTransition(() => { update(); applyNames(mode); });

  const seen = new Set();
  for (const track of $popup.querySelectorAll(".slide[data-slide]")) {
    const key = track.dataset.slide;
    const now = Number(track.style.getPropertyValue("--i"));
    const before = sliderSlots.get(key);
    seen.add(key); sliderSlots.set(key, now);
    const thumb = track.querySelector(":scope > .thumb");
    if (!thumb) continue;
    const selected = track.querySelector(':scope > .tab[aria-selected="true"]');
    if (selected) {
      const rect = selected.getBoundingClientRect(), parent = track.getBoundingClientRect();
      const box = { left: rect.left - parent.left, width: rect.width };
      const old = sliderBoxes.get(key); sliderBoxes.set(key, box);
      thumb.style.left = `${box.left}px`; thumb.style.width = `${box.width}px`; thumb.style.transform = "none";
      if (old && before !== now && !reducedMotion() && typeof thumb.animate === "function") {

          duration: tokenMs("--dur-slow") || 420,
          easing: getComputedStyle(track).getPropertyValue("--ease-out").trim() || "ease-out",
        });

        <button class="btn primary" data-act="add-save" data-testid="add-save">${t("add.save")}</button>
      </div>
    </div></div>`;
}

function emptyView() {
  const p = S.platform, P = PLATFORM[p];
  return `<div class="empty" data-testid="empty">
    <div class="big">${ICON[p].replace('class="mark"', "")}</div>
    <h2>${t("empty.title", { platform: P.name })}</h2>
    <ol>
      <li>${t("empty.step1", { site: P.site })}</li>
      <li>${t("empty.step2")}</li>
      <li>${t("empty.step3")}</li>
    </ol>
    <div class="note info">${t("empty.note")}</div>
    <div class="row-btns">
      <button class="btn" data-act="open-site" data-testid="open-site">${ICON[p]}${t("add.open", { site: P.site })}</button>
      <button class="btn primary" data-act="add" data-testid="add-account">${t("empty.addShort")}</button>
    </div></div>`;
}

function errorNote() {
  const a = find(S.error.id);
  const P = PLATFORM[S.platform];
  const name = a ? nameOf(a) : "";
  return `<div class="note err" role="alert" data-testid="error">
    <div class="t">${ICON.alert}${t("error.title", { name })}</div>
    <div class="d">${t("error.detail", { platform: P.name })}
      <br>${t("error.fix", { name })}</div>
    <div class="btns">
      <button class="btn ghost" data-act="err-close" data-testid="error-close">${t("common.close")}</button>
      <button class="btn" data-act="open-site">${t("error.openLogin")}</button>
      <button class="btn primary" data-act="err-update" data-testid="error-update">${t("error.update")}</button>
    </div></div>`;
}

function unlockButton() {
  const k = S.unlockBtn;
  const face = k === "loading" ? `<span class="spinner" aria-hidden="true"></span>${t("lock.unlocking")}`
    : k === "ok" ? `${ICON.check}${t("lock.unlocked")}`
    : k === "err" ? `${ICON.cross}${t("lock.tryAgain")}`
    : t("lock.unlock");
  return `<button class="btn primary sbtn ${k === "ok" ? "is-ok" : k === "err" ? "is-err" : ""}" data-sbtn data-act="unlock" data-testid="unlock" data-btn-state="${k}" ${k === "loading" ? "disabled" : ""}>${face}</button>`;
}

function renderLocked() {
  $popup.innerHTML = `
    ${header(false).replace(/<button class="icon-btn" data-act="settings-open"[\s\S]*?<\/button>/, "")}
    <section class="lock" data-testid="locked" data-panel>
      <div class="big">${ICON.lockBig}</div>
      <div><b>${t("lock.title")}</b><div class="hint">${t("lock.sub")}</div></div>
      <div class="pw ${S.pwBad ? "bad" : ""}">
        <label class="sr" for="pw-input">${t("lock.label")}</label>
        <input id="pw-input" type="${S.pwShow ? "text" : "password"}" autocomplete="current-password" placeholder="${ta("lock.placeholder")}" value="${esc(S.pw)}" data-testid="pw-input" data-autofocus>
        <button class="icon-btn" data-act="pw-toggle" data-testid="pw-toggle" aria-pressed="${S.pwShow}" aria-label="${ta(S.pwShow ? "lock.hide" : "lock.show")}" title="${ta(S.pwShow ? "lock.hide" : "lock.show")}">${S.pwShow ? ICON.eyeOff : ICON.eye}</button>
      </div>
      <div class="hint ${S.pwBad ? "bad" : ""}" data-testid="pw-hint">${t(S.pwBad ? "lock.bad" : "lock.mockHint")}</div>
      ${S.wipeConfirm ? `<div class="row confirm wipe" data-testid="wipe-confirm">
          <p>${t("wipe.title")}
            <small>${t("wipe.detail")}</small></p>
          <div class="btns"><button class="btn" data-act="wipe-cancel" data-testid="wipe-cancel">${t("common.cancel")}</button>
          <button class="btn danger" data-act="wipe-ok" data-testid="wipe-ok">${t("wipe.ok")}</button></div></div>`
        : `${unlockButton()}
      <button class="btn ghost" data-act="forgot" data-testid="forgot" style="font-size:12px">${t("lock.forgot")}</button>`}
    </section>
    ${footer()}`;
  const f = $popup.querySelector("[data-autofocus]");
  if (f && !S.wipeConfirm) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}

function seg(group, items, current) {
  return `<div class="seg slide" data-slide="${group}" style="--n:${items.length};--i:${Math.max(0, items.findIndex(([v]) => v === current))}" role="group" aria-label="${ta("settings." + group)}"><span class="thumb" aria-hidden="true"></span>${items.map(([v, key, lang]) =>
    `<button data-pref="${group}" data-value="${v}" aria-pressed="${v === current}" data-testid="s-${group}-${v}" ${lang ? `lang="${lang}"` : ""}>${t(key)}</button>`).join("")}</div>`;
}
function renderSettings() {
  const langNow = ta("lang.name." + uiLang());
  $popup.innerHTML = `
    ${header(true)}
    <section class="body settings" data-panel data-testid="settings">
      <div class="set-card" data-card="theme">
        <h2>${t("settings.theme")}</h2>
        ${seg("theme", [["system", "settings.themeSystem"], ["light", "settings.themeLight"], ["dark", "settings.themeDark"]], PREFS.theme)}
      </div>
      <div class="set-card" data-card="lang">
        <h2>${t("settings.language")}</h2>
        ${seg("lang", [["auto", "settings.langAuto"], ["en", "settings.langEn", "en"], ["th", "settings.langTh", "th"]], PREFS.lang)}
        <p>${t("settings.langHint", { lang: langNow })}</p>
      </div>
      <div class="set-card" data-card="lock">
        <h2>${t("settings.lockTitle")}</h2>
        <p>${t("settings.lockDesc")}</p>
        <button class="btn" data-act="lock-now" data-testid="lock-now">${t("settings.lockBtn")}</button>
      </div>
      ${S.settingsWipe
        ? `<div class="set-card danger confirm" data-card="wipe" data-testid="settings-wipe-confirm">
            <h2>${t("settings.wipeConfirmTitle")}</h2>
            <p>${t("settings.wipeConfirmDetail")}</p>
            <div class="btns" style="align-self:flex-end"><button class="btn" data-act="s-wipe-cancel" data-testid="s-wipe-cancel">${t("common.cancel")}</button>
            <button class="btn danger" data-act="s-wipe-ok" data-testid="s-wipe-ok">${t("settings.wipeConfirmOk")}</button></div>
          </div>`
        : `<div class="set-card danger" data-card="wipe">
            <h2>${t("settings.wipeTitle")}</h2>
            <p>${t("settings.wipeDesc")}</p>
            <button class="btn outline-danger" data-act="s-wipe" data-testid="s-wipe">${t("settings.wipeBtn")}</button>
          </div>`}
    </section>
    ${footer()}`;
}

/* =====================================================================
   Actions
   ===================================================================== */
function clearTransient() {
  clearTimeout(toastTimer); clearTimeout(switchTimer); clearTimeout(flashTimer); clearTimeout(btnTimer);
  S.switching = null; S.toast = null; S.error = null; S.editing = null; S.confirmDel = null; S.adding = null; S.flash = null;
  S.pw = ""; S.pwShow = false; S.pwBad = false; S.wipeConfirm = false; S.unlockBtn = "idle"; S.settingsWipe = false;
}

function startSwitch(id, opts = {}) {
  const p = S.platform;
  const a = find(id);
  if (!a || S.switching) return;
  clearTransient();
  const steps = stepsFor(p);
  S.switching = { id, step: 0 };
  render("status");
  const stepMs = opts.stepMs ?? 600;
  const tick = () => {
    if (!S.switching) return;
    if (S.switching.step < steps.length - 1 && !opts.hold) {
      S.switching.step++;
      updateStepInPlace();
      switchTimer = setTimeout(tick, stepMs);
      return;
    }
    if (opts.hold) return;       // used to capture the "switching" state
    finishSwitch(id, opts);
  };
  switchTimer = setTimeout(tick, opts.firstMs ?? stepMs);
}
// Only the label and the bars change between steps, so the spinner keeps turning (no full re-render)
function updateStepInPlace() {
  const row = $popup.querySelector(".row.busy");
  if (!row) return;
  const st = S.switching.step;
  row.querySelector(".sub").textContent = stepLabel(S.platform, st);
  row.querySelectorAll(".steps i").forEach((el, i) => el.classList.toggle("done", i <= st));
}

function finishSwitch(id, opts = {}) {
  const p = S.platform, a = find(id);
  S.switching = null;
  const expired = a.status === "expired";
  S.flash = { id, kind: expired ? "bad" : "ok" };
  if (expired) S.error = { id };                       // the old account was put back: active does not change
  else {
    const prev = find(S.active[p]);
    if (prev) prev.used = ["used.justNow"];
    S.active[p] = id; a.used = ["used.now"];
    S.toast = { name: nameOf(a), tabs: PLATFORM[p].tabs };
  }
  render("status");
  if (opts.keep) return;                               // screenshots: leave the result on screen
  flashTimer = setTimeout(() => { S.flash = null; render("status"); }, 1400);
  if (S.toast) toastTimer = setTimeout(() => { S.toast = null; render("toast"); }, 4000);
}

$popup.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act],[data-tab],[data-pref]");
  if (!el || el.disabled) return;
  if (el.dataset.tab) {
    if (el.dataset.tab === S.platform) return;
    const dir = ORDER.indexOf(el.dataset.tab) > ORDER.indexOf(S.platform) ? 1 : -1;
    clearTransient(); S.platform = el.dataset.tab; return render("tab", { dir });
  }
  if (el.dataset.pref) {
    if (el.dataset.pref === "theme") return setTheme(el.dataset.value, ev);
    return setLang(el.dataset.value);
  }
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "switch": return startSwitch(id);
    case "rename": clearTransient(); S.editing = { id, value: nameOf(find(id)), bad: false }; return render("expand");
    case "rename-cancel": S.editing = null; return render("expand");
    case "rename-save": return saveRename();
    case "delete": clearTransient(); S.confirmDel = id; return render("expand");
    case "del-cancel": S.confirmDel = null; return render("expand");
    case "del-ok": {
      const p = S.platform;
      S.accounts[p] = acc().filter((a) => a.id !== id);
      if (S.active[p] === id) S.active[p] = null;
      S.confirmDel = null; return render("list");
    }
    case "add":
      clearTransient();
      S.adding = document.getElementById("loggedIn").checked
        ? { value: ta("add.defaultName", { platform: PLATFORM[S.platform].name, n: acc().length + 1 }), bad: false, idTail: String(1000 + Math.floor(Math.random() * 9000)) }
        : { notLoggedIn: true };
      return render("expand");
    case "add-cancel": S.adding = null; return render("expand");
    case "add-save": return saveAdd();
    case "err-close": S.error = null; return render("expand");
    case "err-update": {
      const a = find(S.error.id); a.status = "ok"; a.used = ["used.updated"];
      S.error = null; return render("list");
    }
    case "open-site": return;      // the real extension opens a new tab to the site; the mockup does nothing
    case "settings-open": clearTransient(); S.settings = true; return render("page", { dir: 1 });
    case "settings-close": S.settings = false; S.settingsWipe = false; return render("page", { dir: -1 });
    case "lock-now": clearTransient(); S.settings = false; S.locked = true; return render("page", { dir: 1 });
    case "s-wipe": S.settingsWipe = true; return render("expand");
    case "s-wipe-cancel": S.settingsWipe = false; return render("expand");
    case "s-wipe-ok":
      for (const k of ORDER) { S.accounts[k] = []; S.active[k] = null; }
      S.settingsWipe = false; S.settings = false; S.platform = "facebook"; return render("page", { dir: -1 });
    case "unlock": return tryUnlock();
    case "pw-toggle": S.pwShow = !S.pwShow; return render();
    case "forgot": S.wipeConfirm = true; S.pwBad = false; return render("expand");
    case "wipe-cancel": S.wipeConfirm = false; return render("expand");
    case "wipe-ok":
      S.accounts.facebook = []; S.accounts.instagram = []; S.accounts.tiktok = []; S.active.facebook = null; S.active.instagram = null; S.active.tiktok = null;
      S.locked = false; S.platform = "facebook"; clearTransient(); return render("page", { dir: -1 });
  }
});

$popup.addEventListener("keydown", (ev) => {
  const el = ev.target;
  const tab = el.closest?.("[data-tab]");
  if (tab && !tab.disabled && ["ArrowRight", "ArrowLeft", "Home", "End"].includes(ev.key)) {
    ev.preventDefault();
    const i = ORDER.indexOf(tab.dataset.tab);
    const next = ev.key === "Home" ? 0 : ev.key === "End" ? ORDER.length - 1 : (i + (ev.key === "ArrowRight" ? 1 : -1) + ORDER.length) % ORDER.length;
    const platform = ORDER[next];
    let change;
    if (platform !== S.platform) { const dir = next > i ? 1 : -1; clearTransient(); S.platform = platform; change = render("tab", { dir }); }
    Promise.resolve(change?.updateCallbackDone).then(() => $popup.querySelector(`[data-tab="${platform}"]`)?.focus(), () => {});
    return;
  }
  if (el.id === "rename-input") {
    if (ev.key === "Enter") saveRename();
    if (ev.key === "Escape") { S.editing = null; render("expand"); }
  } else if (el.id === "add-input") {
    if (ev.key === "Enter") saveAdd();
    if (ev.key === "Escape") { S.adding = null; render("expand"); }
  } else if (el.id === "pw-input") {
    if (ev.key === "Enter") tryUnlock();
  }
});
$popup.addEventListener("input", (ev) => {
  const el = ev.target;
  const clearBad = (st, key) => {
    if (!st.bad || !el.value.trim()) return;
    st.bad = false;
    const h = el.parentElement.querySelector(".hint");
    h.classList.remove("bad"); h.innerHTML = t(key);
  };
  if (el.id === "rename-input" && S.editing) { S.editing.value = el.value; clearBad(S.editing, "rename.hint"); }
  if (el.id === "add-input" && S.adding) { S.adding.value = el.value; clearBad(S.adding, "add.hint"); }
  if (el.id === "pw-input") {
    S.pw = el.value;
    if (S.pwBad) {
      S.pwBad = false; el.parentElement.classList.remove("bad");
      const h = $popup.querySelector('[data-testid="pw-hint"]'); h.classList.remove("bad"); h.innerHTML = t("lock.mockHint");
    }
  }
});

function saveRename() {
  const v = S.editing.value.trim();
  if (!v) { S.editing.bad = true; return render(); }
  const a = find(S.editing.id); a.label = v.slice(0, 40); S.editing = null; render("expand");
}
function saveAdd() {
  const v = S.adding.value.trim();
  if (!v) { S.adding.bad = true; return render(); }
  const p = S.platform, id = "n" + nextId++;
  const sub = p === "youtube" ? ["sub.google", { n: 2 }] : ["id", S.adding.idTail];
  const prev = find(S.active[p]); if (prev) prev.used = ["used.justNow"];
  acc().push({ id, label: v.slice(0, 40), sub, used: ["used.now"], status: "ok" });
  S.active[p] = id; S.adding = null; render("list");
}
// The unlock button is the "status button": idle -> loading -> success (or error), each step is a morph.
function tryUnlock(opts = {}) {
  if (S.unlockBtn === "loading") return;
  const ok = S.pw === "orange-cat-2026";
  S.unlockBtn = "loading"; render("status");
  btnTimer = setTimeout(() => {
    if (ok) {
      S.unlockBtn = "ok"; render("status");
      btnTimer = setTimeout(() => { S.locked = false; S.pw = ""; S.pwShow = false; S.pwBad = false; S.unlockBtn = "idle"; render("page", { dir: -1 }); }, 450);
    } else {
      S.pwBad = true; S.pw = ""; S.unlockBtn = "err"; render("status");
      btnTimer = setTimeout(() => { S.unlockBtn = "idle"; render("status"); }, 1100);
    }
  }, opts.ms ?? 500);
}

/* =====================================================================
   Mockup controls (not part of the extension)
   ===================================================================== */
const JUMPS = [
  ["list", "List"], ["empty", "Empty"], ["add-form", "Add form"], ["add-not-logged-in", "Not logged in"],
  ["switching", "Switching"], ["success", "Success"], ["error", "Error"], ["rename", "Rename"],
  ["delete", "Delete confirm"], ["youtube", "YouTube"], ["locked", "Locked"], ["locked-wrong", "Wrong password"],
  ["wipe-confirm", "Forgot password"], ["settings", "Settings"], ["settings-wipe", "Wipe confirm"],
];
document.getElementById("jumps").innerHTML = JUMPS.map(([k, label]) => `<button data-jump="${k}" data-testid="demo-${k}">${label}</button>`).join("");

function jump(state) {
  clearTransient(); S.locked = false; S.settings = false;
  const fresh = seed(); S.accounts = fresh.accounts; S.active = fresh.active; S.platform = "facebook";
  const hold = { stepMs: 0, keep: true };
  switch (state) {
    case "empty": S.platform = "instagram"; break;
    case "list": break;
    case "add-form": S.adding = { value: ta("add.defaultName", { platform: "Facebook", n: 4 }), bad: false, idTail: "3052" }; break;
    case "add-not-logged-in": S.adding = { notLoggedIn: true }; break;
    case "switching": render(); return startSwitch("fb2", { hold: true, stepMs: 0 });
    case "success": render(); return startSwitch("fb2", { ...hold });
    case "error": render(); return startSwitch("fb3", { ...hold });
    case "rename": S.editing = { id: "fb2", value: nameOf(find("fb2")), bad: false }; break;
    case "delete": S.confirmDel = "fb3"; break;
    case "youtube": S.platform = "youtube"; render(); return startSwitch("yt3", { ...hold });
    case "locked": S.locked = true; break;
    case "locked-wrong": S.locked = true; S.pwBad = true; break;
    case "wipe-confirm": S.locked = true; S.wipeConfirm = true; break;
    case "settings": S.settings = true; break;
    case "settings-wipe": S.settings = true; S.settingsWipe = true; break;
  }
  render();
}
document.getElementById("jumps").addEventListener("click", (ev) => { const b = ev.target.closest("[data-jump]"); if (b) jump(b.dataset.jump); });
document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", (ev) => setTheme(b.dataset.themeSet, ev)));
document.querySelectorAll("[data-lang-set]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.langSet)));
document.getElementById("reset").addEventListener("click", () => { clearTransient(); S = seed(); render(); });
window.__mock = { jump, tryUnlock };   // hooks for the e2e script only

applyTheme();
applyLang();
doRender();
</script>
